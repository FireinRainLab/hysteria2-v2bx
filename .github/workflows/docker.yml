name: Build Docker Image

on:
  workflow_dispatch:

  push:
    tags:
      - "app/v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#app/v}"
          else
            VERSION="dev"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          echo "Version: ${VERSION}"

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          IMAGE_NAME_LOWER="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"

          echo "name=${IMAGE_NAME_LOWER}" >> "$GITHUB_OUTPUT"

          echo "Image: ${IMAGE_NAME_LOWER}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: |
            linux/amd64
            linux/arm64

          tags: |
            fireinrainlab/hysteria2-v2bx:latest
            fireinrainlab/hysteria2-v2bx:v2
            fireinrainlab/hysteria2-v2bx:${{ steps.get_version.outputs.version }}

            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:v2
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.get_version.outputs.version }}

      - name: Image digest
        run: |
          echo "Digest: ${{ steps.docker_build.outputs.digest }}"