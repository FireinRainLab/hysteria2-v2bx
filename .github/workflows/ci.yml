name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Build core
        working-directory: core
        run: go build ./...

      - name: Vet core
        working-directory: core
        run: go vet ./...

      - name: Build extras
        working-directory: extras
        run: go build ./...

      - name: Vet extras
        working-directory: extras
        run: go vet ./...

      - name: Build app
        working-directory: app
        run: go build ./...

      - name: Vet app
        working-directory: app
        run: go vet ./...

      - name: Test core
        working-directory: core
        run: go test -v -count=1 -skip 'Stress' ./...

      - name: Test extras
        working-directory: extras
        run: go test -v -count=1 ./...

      - name: Test app
        working-directory: app
        run: go test -v -count=1 ./...